aid: flatfile
name: Flatfile
description: >-
  Flatfile is a data exchange platform that helps teams import, transform, validate, and collaborate on file-based data.
  The Flatfile API provides programmatic access to spaces, workbooks, sheets, records, files, documents, jobs, events,
  agents, environments, users, guests, and related primitives for building automated data onboarding and ingestion
  workflows.
