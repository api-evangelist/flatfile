openapi: 3.2.0
info:
  title: Reference Subpackage Events API
  version: 1.0.0
servers:
- url: https://api.x.flatfile.com/v1
tags:
- name: subpackage_events
paths:
  /events:
    get:
      operationId: list
      summary: List events
      description: Event topics that the Flatfile Platform emits.
      tags:
      - subpackage_events
      parameters:
      - name: environmentId
        in: query
        description: Filter by environment
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_EnvironmentId'
      - name: spaceId
        in: query
        description: Filter by space
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_SpaceId'
      - name: domain
        in: query
        description: Filter by event domain
        required: false
        schema:
          type: string
      - name: topic
        in: query
        description: Filter by event topic
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: Filter by event timestamp
        required: false
        schema:
          type: string
          format: date-time
      - name: pageSize
        in: query
        description: Number of results to return in a page (default 10)
        required: false
        schema:
          type: integer
      - name: pageNumber
        in: query
        description: Based on pageSize, which page of results to return
        required: false
        schema:
          type: integer
      - name: includeAcknowledged
        in: query
        description: Include acknowledged events
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_events_ListAllEventsResponse'
    post:
      operationId: create
      summary: Create an event
      tags:
      - subpackage_events
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_events_EventResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_events_CreateEventConfig'
  /events/{eventId}:
    get:
      operationId: get
      summary: Get an event
      tags:
      - subpackage_events
      parameters:
      - name: eventId
        in: path
        description: The event id
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_EventId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_events_EventResponse'
  /events/{eventId}/ack:
    post:
      operationId: ack
      summary: Acknowledge an event
      tags:
      - subpackage_events
      parameters:
      - name: eventId
        in: path
        description: The event id
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_EventId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Success'
  /subscription:
    get:
      operationId: get-event-token
      summary: Get subscription credentials
      description: Get a token which can be used to subscribe to events for this space
      tags:
      - subpackage_events
      parameters:
      - name: scope
        in: query
        description: The resource ID of the event stream (space or environment id)
        required: false
        schema:
          type: string
      - name: spaceId
        in: query
        description: The space ID of the event stream
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_SpaceId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_spaces_EventTokenResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
