openapi: 3.2.0
info:
  title: Reference Subpackage Routines API
  version: 1.0.0
servers:
- url: https://api.x.flatfile.com/v1
tags:
- name: subpackage_routines
paths:
  /routines:
    get:
      operationId: list
      summary: List routines
      description: Returns a list of routines
      tags:
      - subpackage_routines
      parameters:
      - name: runbookId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_RunbookId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_routines_RoutinesResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
    post:
      operationId: create
      summary: Create a routine
      description: Creates a new routine
      tags:
      - subpackage_routines
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_routines_RoutineResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_routines_CreateRoutineRequest'
  /routines/{routineId}:
    get:
      operationId: get
      summary: Get a routine
      description: Returns a routine
      tags:
      - subpackage_routines
      parameters:
      - name: routineId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_RoutineId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_routines_RoutineResponse'
    patch:
      operationId: update
      summary: Update a routine
      description: Updates a routine
      tags:
      - subpackage_routines
      parameters:
      - name: routineId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_RoutineId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_routines_RoutineResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_routines_UpdateRoutineRequest'
    delete:
      operationId: delete
      summary: Delete a routine
      description: Deletes a routine
      tags:
      - subpackage_routines
      parameters:
      - name: routineId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_RoutineId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      - name: X-Disable-Hooks
        in: header
        required: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Success'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons_Errors'
components:
  schemas:
    type_routines_Routine:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_commons_RoutineId'
          description: The ID of the Routine.
        runbookId:
          $ref: '#/components/schemas/type_commons_RunbookId'
        name:
          type: string
          description: The name of the Routine.
        config:
          description: Configuration for the Routine. Related to the type of Routine.
        ordinal:
          type: integer
          description: The order of the Routine in the Runbook.
        type:
          $ref: '#/components/schemas/type_routines_RoutineType'
          description: The type of Routine.
        createdBy:
          type: string
          description: The entity which created the Runbook.
        createdAt:
          type: string
          format: date-time
          description: Date the sheet was created
        updatedAt:
          type: string
          format: date-time
          description: Date the sheet was last updated
      required:
      - id
      - runbookId
      - name
      - config
      - ordinal
      - type
      - createdBy
      - createdAt
      - updatedAt
      description: Routine is a set of instructions or procedures that are followed to complete a task.
      title: Routine
    type_commons_SuccessData:
      type: object
      properties:
        success:
          type: boolean
      required:
      - success
      title: SuccessData
    type_routines_RoutineResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/type_routines_Routine'
      required:
      - data
      title: RoutineResponse
    type_commons_RunbookId:
      type: string
      description: Runbook ID
      title: RunbookId
    type_routines_UpdateRoutineRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the Routine.
        config:
          description: Configuration for the Routine. Related to the type of Routine.
        ordinal:
          type: integer
          description: The order of the Routine in the Runbook.
        type:
          $ref: '#/components/schemas/type_routines_RoutineType'
          description: The type of Routine.
      required:
      - name
      - config
      - ordinal
      - type
      title: UpdateRoutineRequest
    type_routines_RoutineType:
      type: string
      enum:
      - JOB
      title: RoutineType
    type_commons_RoutineId:
      type: string
      description: Routine ID
      title: RoutineId
    type_commons_Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/type_commons_Error'
      required:
      - errors
      title: Errors
    type_commons_Error:
      type: object
      properties:
        key:
          type: string
        message:
          type: string
      required:
      - message
      title: Error
    type_commons_Success:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/type_commons_SuccessData'
      description: Informs whether or not a request was successful
      title: Success
    type_routines_RoutinesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/type_routines_Routine'
      required:
      - data
      title: RoutinesResponse
    type_routines_CreateRoutineRequest:
      type: object
      properties:
        runbookId:
          $ref: '#/components/schemas/type_commons_RunbookId'
        name:
          type: string
          description: The name of the Routine.
        config:
          description: Configuration for the Routine. Related to the type of Routine.
        ordinal:
          type: integer
          description: The order of the Routine in the Runbook.
        type:
          $ref: '#/components/schemas/type_routines_RoutineType'
          description: The type of Routine.
      required:
      - runbookId
      - name
      - config
      - ordinal
      - type
      title: CreateRoutineRequest
  securitySchemes:
    default:
      type: http
      scheme: bearer
